[project]
name = "parascan-backend"
version = "0.1.0"
description = "Two-stage blood smear classifier: smear type, then malaria / lymphatic filariasis species."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "pillow>=10",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
